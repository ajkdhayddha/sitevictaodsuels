<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOOM DUELO · CHROMOS</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#0a0000;color:#c66;font-family:'Press Start 2P',monospace,Courier}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
canvas{width:100%;max-width:960px;max-height:88%;aspect-ratio:16/9;background:#000;border:3px solid #400;cursor:crosshair;touch-action:none}
label{font-size:9px;border:2px solid #600;padding:8px 12px;cursor:pointer;background:#200;color:#fc6}
label:hover{background:#400}
input{display:none}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<label>CARREGAR LOGO DO CHROMOS<input type="file" id="lg" accept="image/*"></label>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=960,H=540,LW=480,SHOTS=6,ROUNDS=3,F="'Press Start 2P',monospace";
let state='menu',mode='',round=1,t=0,rt=0,shake=0,msg='',logo=null,endT=0,qStart=0,matched=false,myRd=0,lostT=0;
let room=null,gr=null,oppPeer=null,mx=LW/2,my=300,parts=[],ac;
const keys={};
const L=[0,LW].map((x0,i)=>({x0,col:i?'#f93':'#4f4',name:''}));
const btns=[{k:'online',s:'1 · JOGAR ONLINE (MATCHMAKING)',y:300},{k:'bot',s:'2 · SOLO CONTRA BOT',y:350},{k:'local',s:'3 · LOCAL 2P (MOUSE + SETAS)',y:400}];
// ---------- logo ----------
document.getElementById('lg').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>logo=im;im.src=r.result};r.readAsDataURL(f)};
// ---------- som ----------
function snd(f,d,type='sawtooth',v=.15){try{ac=ac||new AudioContext();const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+d);gn.gain.setValueAtTime(v,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(gn).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
// ---------- jogo ----------
function tp(r,q){const s=.9+r*.5,ph=r*2.3,tt=Math.max(q,0)/60;return{x:LW/2+Math.sin(tt*s*2+ph)*(120+r*30),y:210+Math.sin(tt*s*1.3+ph*2)*(30+r*14)}}
function resetLane(l){Object.assign(l,{shots:SHOTS,rs:0,holes:[],pop:[],flash:0,cool:0,done:false,fw:0,fc:0,lastfl:0,tx:LW/2,ty:210})}
function total(l){return l.rounds.reduce((a,b)=>a+b,0)}
function newGame(m){
 mode=m;round=1;rt=-90;myRd=0;parts=[];
 L.forEach((l,i)=>{resetLane(l);l.rounds=[];l.cx=l.x0+LW/2;l.cy=300});
 L[0].ctrl='mouse';L[1].ctrl=m==='online'?'remote':m==='bot'?'bot':'keys';
 L[0].name=m==='local'?'MARINE 1':'VOCE';L[1].name=m==='bot'?'BOT':m==='online'?'RIVAL':'MARINE 2';
 state='play';
}
function addHit(l,rx,ry,dx,dy,pts,mine){
 const x=l.x0+rx,y=ry;
 if(pts){l.holes.push({dx,dy});for(let i=0;i<14;i++)parts.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*6,l:30,c:Math.random()<.5?'#f00':'#fa0'});shake=pts>=100?14:7;snd(90,.15,'square',.2)}
 l.pop.push({x,y:y-20,s:pts>=100?'HEADSHOT +100':pts?'+'+pts:'MISS',l:50,c:pts?'#ff0':'#888'});
}
function fire(l){
 if(state!=='play'||rt<0||l.shots<=0||l.cool>0)return;
 l.shots--;l.cool=18;l.flash=6;l.fc++;snd(180,.25,'sawtooth',.2);shake=Math.max(shake,3);
 const dx=l.cx-(l.x0+l.tx),dy=l.cy-l.ty,d=Math.hypot(dx,dy);
 const pts=d<12?100:d<28?60:d<52?30:0;
 l.rs+=pts;addHit(l,l.cx-l.x0,l.cy,dx,dy,pts);
 if(mode==='online'&&l===L[0]&&gr)gr.emit('shot',{r:round,x:Math.round(l.cx-l.x0),y:Math.round(l.cy),dx:Math.round(dx),dy:Math.round(dy),p:pts}).catch(()=>{});
}
function advance(){
 round++;rt=-90;myRd=0;L.forEach(resetLane);state='play';
}
function commit(){L.forEach(l=>l.rounds.push(l.rs));endT=performance.now();state=round>=ROUNDS?'end':'roundEnd'}
function update(){
 t++;shake*=.85;
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--});parts=parts.filter(p=>p.l>0);
 if(state==='queue')return;
 if(mode==='online'&&gr&&state!=='menu'&&state!=='queue'){
  const ps=gr.peers();if(ps.length<2){if(++lostT>180){endOnline();msg='RIVAL SAIU DA PARTIDA';state='menu'}}else lostT=0;
  const o=ps.find(p=>!p.isMe);
  if(o){const q=o.presence,l=L[1];oppPeer=o.peer;
   if(typeof q.cx==='number'){l.cx=l.x0+q.cx;l.cy=q.cy;l.tx=q.tx;l.ty=q.ty;l.shots=q.sh;l.rs=q.rs;
    if(q.fl!==l.lastfl){l.lastfl=q.fl;l.flash=6;snd(150,.2,'sawtooth',.08)}}
   l.done=q.dn===round;l.opRd=q.rd||0}
 }
 if(state==='play'){
  rt++;const T=tp(round,rt);
  L.forEach(l=>{if(l.ctrl!=='remote'){l.tx=T.x;l.ty=T.y}if(l.cool>0)l.cool--;if(l.flash>0)l.flash--;l.pop.forEach(o=>{o.l--;o.y-=.5});l.pop=l.pop.filter(o=>o.l>0)});
  const a=L[0];a.cx=Math.max(10,Math.min(LW-10,mx))+Math.sin(t*.3)*.4;a.cy=Math.max(80,Math.min(400,my));
  const b=L[1];
  if(b.ctrl==='keys'){const s=5;if(keys.ArrowLeft)b.cx-=s;if(keys.ArrowRight)b.cx+=s;if(keys.ArrowUp)b.cy-=s;if(keys.ArrowDown)b.cy+=s;b.cx=Math.max(b.x0+10,Math.min(b.x0+LW-10,b.cx));b.cy=Math.max(80,Math.min(400,b.cy))}
  if(b.ctrl==='bot'&&rt>0){
   b.bt=(b.bt||0)+1;if(b.bt%40===1){const sg=40-round*9;b.nx=(Math.random()-.5)*sg*2;b.ny=(Math.random()-.5)*sg*2}
   b.cx+=((b.x0+T.x+(b.nx||0))-b.cx)*.08;b.cy+=((T.y+(b.ny||0))-b.cy)*.08;
   if(b.bt%75===0)fire(b)}
  if(L[0].shots===0)L[0].fw++;if(L[0].fw>70)L[0].done=true;
  if(b.ctrl!=='remote'){if(b.shots===0)b.fw++;if(b.fw>70)b.done=true}
  if(L[0].done&&L[1].done)commit();
 }
 if(state==='roundEnd'&&mode==='online'&&myRd>=round&&L[1].opRd>=round)advance();
 if(mode==='online'&&gr&&t%2===0&&state!=='menu'&&state!=='queue'){const a=L[0];gr.presence({cx:Math.round(a.cx-a.x0),cy:Math.round(a.cy),tx:Math.round(a.tx),ty:Math.round(a.ty),sh:a.shots,rs:a.rs,fl:a.fc,dn:a.done?round:0,rd:myRd}).catch(()=>{})}
}
// ---------- online ----------
async function goOnline(){
 state='queue';qStart=performance.now();matched=false;msg='';
 room=null;
 if(window.claude&&claude.use){try{room=await claude.use('room')}catch(e){room=null}}
 if(!room){
  if(window.Peer)return peerMatch();
  state='menu';msg='ONLINE INDISPONIVEL (SEM SERVIDOR)';return;
 }
 room.presence({mm:'q',ts:Date.now()}).catch(()=>{});
 const un=room.onPeers(ch=>{
  if(state!=='queue'||matched)return;
  const q=ch.peers.filter(p=>p.kind==='viewer'&&p.presence.mm==='q').sort((a,b)=>(a.presence.ts-b.presence.ts)||(a.peer<b.peer?-1:1));
  const i=q.findIndex(p=>p.sameTab);if(i<0)return;
  const j=i%2?i-1:i+1;if(j>=q.length)return;
  matched=true;un();startMatch(q[Math.min(i,j)],q[Math.max(i,j)]);
 });
}
// ---- matchmaking P2P (PeerJS) para uso fora do claude.ai ----
let peerObj=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function mkNet(conn){
 const pr={},hs={};
 conn.on('data',m=>{if(!m)return;if(m.t==='p')Object.assign(pr,m.d);else if(m.t==='e'&&hs[m.tp])hs[m.tp]({isMe:false,data:m.d})});
 return{
  presence(p){if(conn.open)conn.send({t:'p',d:p});return Promise.resolve()},
  emit(tp,d){if(conn.open)conn.send({t:'e',tp,d});return Promise.resolve()},
  on(tp,f){hs[tp]=f},
  peers(){return conn.open?[{isMe:true,presence:{}},{isMe:false,peer:conn.peer,presence:pr}]:[{isMe:true,presence:{}}]},
  leave(){try{conn.close()}catch(e){}}
 };
}
function tryHost(id){return new Promise(res=>{
 const p=new Peer(id);let done=false;
 const fin=v=>{if(!done){done=true;res(v);if(!v){try{p.destroy()}catch(_){}}}};
 p.on('open',()=>fin(p));p.on('error',()=>fin(null));setTimeout(()=>fin(null),6000);
})}
function tryGuest(id){return new Promise(res=>{
 const p=new Peer();let done=false;
 const fin=v=>{if(!done){done=true;res(v);if(!v){try{p.destroy()}catch(_){}}}};
 p.on('error',()=>fin(null));
 p.on('open',()=>{const c=p.connect(id,{reliable:true});
  c.on('data',m=>{if(m&&m.t==='hi')fin({p,c});else if(m&&m.t==='busy')fin(null)});
  c.on('close',()=>fin(null));c.on('error',()=>fin(null))});
 setTimeout(()=>fin(null),5000);
})}
async function peerMatch(){
 while(state==='queue'&&!matched){
  for(let s=1;s<=6&&state==='queue'&&!matched;s++){
   const id='chromosduelo-v1-slot'+s;
   const h=await tryHost(id);
   if(h){
    if(state!=='queue'){try{h.destroy()}catch(_){}return}
    peerObj=h;
    h.on('connection',c=>c.on('open',()=>{
     if(matched||state!=='queue'){c.send({t:'busy'});setTimeout(()=>c.close(),300);return}
     matched=true;c.send({t:'hi'});gr=mkNet(c);wireNet();newGame('online');
    }));
    const end=performance.now()+8000+Math.random()*4000;
    while(state==='queue'&&!matched&&performance.now()<end)await sleep(200);
    if(matched)return;
    try{h.destroy()}catch(_){}peerObj=null;break;
   }else{
    const r=await tryGuest(id);
    if(r&&state==='queue'){matched=true;peerObj=r.p;gr=mkNet(r.c);wireNet();newGame('online');return}
    if(r){try{r.p.destroy()}catch(_){}}
   }
  }
  await sleep(300);
 }
}
function wireNet(){gr.on('shot',m=>{if(m.isMe||state==='menu')return;const d=m.data||{};if(d.r!==round)return;addHit(L[1],d.x,d.y,d.dx,d.dy,d.p)})}
async function startMatch(a,b){
 const n=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
 try{
  await room.presence({mm:'g'});
  gr=await room.join('g-'+n(a.peer)+'-'+n(b.peer));
  wireNet();
  const t0=performance.now();
  const wait=()=>{if(state!=='queue')return;if(gr.peers().length>=2){newGame('online')}else if(performance.now()-t0>12000){endOnline();msg='FALHA AO CONECTAR';state='menu'}else setTimeout(wait,200)};
  wait();
 }catch(e){endOnline();msg='FALHA NO MATCH';state='menu'}
}
function endOnline(){try{if(gr)gr.leave()}catch(e){}gr=null;try{if(peerObj)peerObj.destroy()}catch(e){}peerObj=null;if(room){room.presence({mm:null}).catch(()=>{})}matched=false}
function toMenu(){endOnline();state='menu';mode=''}
// ---------- entrada ----------
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointermove',e=>{const p=pos(e);mx=p.x;my=p.y});
cv.addEventListener('pointerdown',e=>{
 const p=pos(e);mx=p.x;my=p.y;
 if(state==='menu'){btns.forEach(b=>{if(Math.abs(p.x-W/2)<260&&Math.abs(p.y-b.y)<22)pick(b.k)});return}
 if(state==='play')fire(L[0]);
 else clickNext();
});
function pick(k){msg='';k==='online'?goOnline():newGame(k)}
function clickNext(){
 if(performance.now()-endT<1000&&state!=='queue')return;
 if(state==='roundEnd'){if(mode==='online')myRd=round;else advance()}
 else if(state==='end')toMenu();
 else if(state==='queue'){endOnline();state='menu'}
}
addEventListener('keydown',e=>{
 if(['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.repeat)return;keys[e.code]=1;
 if(state==='menu'){if(e.code==='Digit1')pick('online');if(e.code==='Digit2')pick('bot');if(e.code==='Digit3')pick('local');return}
 if(e.code==='Escape'&&state!=='play'){toMenu();return}
 if(state==='play'){if(e.code==='Enter'&&L[1].ctrl==='keys')fire(L[1]);if(e.code==='Space')fire(L[0])}
 else if(e.code==='Space'||e.code==='Enter')clickNext();
});
addEventListener('keyup',e=>keys[e.code]=0);
// ---------- desenho ----------
function txt(s,x,y,size,col,al='center'){g.font=size+'px '+F;g.textAlign=al;g.fillStyle='#000';g.fillText(s,x+2,y+2);g.fillStyle=col;g.fillText(s,x,y)}
function drawTarget(x,y){
 g.fillStyle='#000';g.beginPath();g.arc(x,y,56,0,7);g.fill();
 g.save();g.beginPath();g.arc(x,y,50,0,7);g.clip();
 if(logo){g.fillStyle='#fff';g.fillRect(x-50,y-50,100,100);const s=Math.min(100/logo.width,100/logo.height);g.drawImage(logo,x-logo.width*s/2,y-logo.height*s/2,logo.width*s,logo.height*s)}
 else{for(let i=0;i<12;i++){g.fillStyle='hsl('+i*30+',85%,52%)';g.beginPath();g.moveTo(x,y);g.arc(x,y,50,i*Math.PI/6,(i+1)*Math.PI/6);g.fill()}
  g.fillStyle='#fff';g.beginPath();g.arc(x,y,20,0,7);g.fill();txt('C',x,y+6,16,'#111')}
 g.restore();
 g.lineWidth=3;[52,28,12].forEach((r,i)=>{g.strokeStyle=['#c00','#f80','#ff0'][i];g.beginPath();g.arc(x,y,r,0,7);g.stroke()});
}
function drawLane(l,i){
 const x0=l.x0;
 g.save();g.beginPath();g.rect(x0,0,LW,H);g.clip();
 g.fillStyle='#2a0a0a';g.fillRect(x0,0,LW,H);
 for(let r=0;r<12;r++)for(let c=-1;c<9;c++){const ox=(r%2)*30;g.fillStyle=(r+c)%3?'#3a1010':'#2f0c0c';g.fillRect(x0+c*60+ox,60+r*28,57,25)}
 const gr2=g.createLinearGradient(0,400,0,H);gr2.addColorStop(0,'#1a1a1a');gr2.addColorStop(1,'#000');g.fillStyle=gr2;g.fillRect(x0,400,LW,H-400);
 g.fillStyle='#600';g.fillRect(x0,398,LW,4);
 const tx=x0+l.tx,ty=l.ty;drawTarget(tx,ty);
 l.holes.forEach(h=>{g.fillStyle='#000';g.beginPath();g.arc(tx+h.dx,ty+h.dy,3,0,7);g.fill();g.strokeStyle='#f00';g.lineWidth=1;g.stroke()});
 g.strokeStyle=l.col;g.lineWidth=2;g.beginPath();g.arc(l.cx,l.cy,12,0,7);
 [[-20,-6],[6,20]].forEach(([a,b])=>{g.moveTo(l.cx+a,l.cy);g.lineTo(l.cx+b,l.cy);g.moveTo(l.cx,l.cy+a);g.lineTo(l.cx,l.cy+b)});g.stroke();
 const gx=x0+LW/2+(l.cx-(x0+LW/2))*.35,gy=H-120+l.flash*2;
 if(l.flash>2){g.fillStyle='#ff0';g.beginPath();g.arc(gx,gy-10,30,0,7);g.fill();g.fillStyle='#f80';g.beginPath();g.arc(gx,gy-10,18,0,7);g.fill()}
 g.fillStyle='#555';g.fillRect(gx-14,gy,28,120);g.fillStyle='#888';g.fillRect(gx-8,gy,8,120);g.fillStyle='#222';g.fillRect(gx-10,gy,20,10);
 g.fillStyle='#5a3216';g.fillRect(gx-30,gy+70,60,60);g.fillStyle='#7a4a22';g.fillRect(gx-30,gy+70,60,10);
 l.pop.forEach(o=>txt(o.s,o.x,o.y,10,o.c));
 g.restore();
 g.fillStyle='#000';g.fillRect(x0,0,LW,56);g.fillStyle='#600';g.fillRect(x0,54,LW,3);
 txt(l.name,x0+LW/2,22,12,l.col);
 txt('PONTOS '+(total(l)+(state==='play'?l.rs:0)),x0+LW/2,44,10,'#fff');
 for(let b=0;b<SHOTS;b++){g.fillStyle=b<l.shots?'#fc0':'#333';g.fillRect(x0+LW/2-90+b*32,H-26,22,12)}
}
function face(){
 const a=total(L[0])+L[0].rs,b=total(L[1])+L[1].rs,x=W/2,y=H-38;
 g.fillStyle='#c96';g.fillRect(x-20,y-20,40,40);g.fillStyle='#000';g.fillRect(x-12,y-8,8,6);g.fillRect(x+4,y-8,8,6);
 g.fillStyle='#600';if(a>b)g.fillRect(x-8,y+8,16,4);else if(a<b){g.fillRect(x-8,y+12,16,3);g.fillStyle='#a00';g.fillRect(x+6,y-18,6,10)}else g.fillRect(x-6,y+10,12,3);
}
function draw(){
 g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.fillRect(0,0,W,H);
 if(state==='menu'||state==='queue'){
  const gr3=g.createLinearGradient(0,0,0,H);gr3.addColorStop(0,'#400');gr3.addColorStop(1,'#000');g.fillStyle=gr3;g.fillRect(0,0,W,H);
  txt('DOOM',W/2,120,56,'#d00');txt('DUELO',W/2,190,56,'#f60');
  txt('ALVO: LOGO DO COLEGIO CHROMOS',W/2,235,10,'#fc6');
  txt('MOUSE MIRA · CLIQUE ATIRA · 6 TIROS · 3 ROUNDS',W/2,262,9,'#a66');
  if(state==='menu'){
   btns.forEach(b=>{g.fillStyle='#300';g.fillRect(W/2-260,b.y-22,520,44);g.strokeStyle='#a00';g.lineWidth=2;g.strokeRect(W/2-260,b.y-22,520,44);txt(b.s,W/2,b.y+5,12,'#ff0')});
   if(msg)txt(msg,W/2,470,10,'#f55');
  }else{
   const s=((performance.now()-qStart)/1000)|0;
   txt('PROCURANDO RIVAL'+'.'.repeat(1+(t/20|0)%3),W/2,340,16,'#ff0');
   txt('AGUARDANDO '+s+'s  ·  ESC CANCELA',W/2,380,10,'#ccc');
   if(s>8)txt('NINGUEM? ABRA EM OUTRA ABA OU JOGUE CONTRA O BOT',W/2,425,9,'#a66');
  }
  return;
 }
 g.save();if(shake>.5)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 L.forEach(drawLane);
 g.fillStyle='#600';g.fillRect(LW-3,0,6,H);
 parts.forEach(p=>{g.fillStyle=p.c;g.fillRect(p.x,p.y,4,4)});
 g.restore();
 g.fillStyle='#000';g.fillRect(W/2-70,60,140,26);txt('ROUND '+round+'/'+ROUNDS,W/2,79,11,'#f60');
 face();
 if(state==='play'){
  if(rt<0)txt('PREPARE-SE!',W/2,270,24,'#ff0');
  else if(L[0].done&&!L[1].done)txt('AGUARDANDO RIVAL...',W/2,270,14,'#ff0');
 }
 g.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<H;y+=3)g.fillRect(0,y,W,1);
 if(state==='roundEnd'||state==='end'){
  g.fillStyle='rgba(0,0,0,.84)';g.fillRect(0,0,W,H);
  const a=L[0].rounds.at(-1),b=L[1].rounds.at(-1);
  if(state==='roundEnd'){
   txt('ROUND '+round+' COMPLETO',W/2,120,24,'#d00');
   txt(a+'  x  '+b,W/2,190,28,'#fff');
   txt(a>b?L[0].name+' VENCEU O ROUND':b>a?L[1].name+' VENCEU O ROUND':'EMPATE NO ROUND',W/2,240,14,a>b?L[0].col:b>a?L[1].col:'#ccc');
   txt('TOTAL  '+total(L[0])+'  x  '+total(L[1]),W/2,300,14,'#fc0');
   txt(mode==='online'&&myRd>=round?'AGUARDANDO RIVAL...':'CLIQUE / ESPACO: PROXIMO ROUND',W/2,400,12,'#ff0');
  }else{
   const A=total(L[0]),B=total(L[1]),w=A>B?0:B>A?1:-1;
   txt('FIM DE JOGO',W/2,100,28,'#d00');
   L.forEach((l,i)=>txt(l.name+': '+l.rounds.join(' + ')+' = '+total(l),W/2,170+i*34,13,l.col));
   txt(w<0?'EMPATE!':L[w].name+' VENCEU!',W/2,300,24,w<0?'#ccc':L[w].col);
   txt('CLIQUE / ESPACO: MENU',W/2,420,12,'#ff0');
  }
 }
}
L.forEach(l=>{resetLane(l);l.rounds=[]});
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
